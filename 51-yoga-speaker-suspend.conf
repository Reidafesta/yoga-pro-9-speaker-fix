# Keep the speaker output open for 5 minutes after sound stops (default: 5 seconds).
# With the fix, every time the output opens the amps are set up from scratch, which delays
# the start of playback by ~2.5 s. This keeps short pauses and video switches instant.
# Installed to /etc/wireplumber/wireplumber.conf.d/ (WirePlumber 0.5).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*Speaker__sink" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 300
      }
    }
  }
]
