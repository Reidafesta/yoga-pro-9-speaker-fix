# Yoga Pro 9 speaker fix: how long the speaker output stays open after sound stops.
#
# WirePlumber's own default is 5 seconds. With the fix, every time the output opens again the
# amps are set up from scratch, which delays the start of playback by ~2.5 s. Keeping the
# output open longer makes pauses and video switches instant.
#
# Value in seconds. Default here: 300 (5 minutes). 0 = never close (no delay ever, but the
# amps stay powered all the time). To change it, edit the number below and then run, as
# yourself (not root):  systemctl --user restart wireplumber
# Or re-run the installer with the new value:  sudo ./install.sh 600
#
# Installed to /etc/wireplumber/wireplumber.conf.d/ (WirePlumber 0.5).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*Speaker__sink" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 300
      }
    }
  }
]
